<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1175" viewBox="0 0 1500 1175"><g font-family="Arial,Malgun Gothic,sans-serif"><text x="30" y="155" font-size="65" fill="#50773a" font-style="italic">Respect differences</text><g font-size="108" font-weight="700" fill="#25362e"><text x="25" y="340">네오아이즈의</text><text x="25" y="475">2026년을 돌아보다</text></g><g font-size="58" fill="#4e5851"><text x="30" y="645">2026년의 주요 행사와 함께한 순간들을</text><text x="30" y="735">소개하는 네오아이즈의 기록 공간입니다.</text><text x="30" y="895">서로의 다름을 존중하며 함께 만든</text><text x="30" y="985">뜻깊은 장면들을 만나보세요.</text></g></g></svg>